name: Build Android APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Web Assets & Capacitor
        run: |
          mkdir -p www
          if [ -f "index.html" ]; then
            cp index.html www/
          else
            echo "<!DOCTYPE html><html><body><h1>WebZip</h1></body></html>" > www/index.html
          fi
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init WebZip com.webzip.app --web-dir www
          npx cap add android

      - name: Add Storage Permission
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />' android/app/src/main/AndroidManifest.xml

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebZip-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
